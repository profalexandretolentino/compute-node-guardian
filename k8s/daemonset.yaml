apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: compute-node-guardian
  labels:
    app: compute-node-guardian
spec:
  selector:
    matchLabels:
      app: compute-node-guardian
  template:
    metadata:
      labels:
        app: compute-node-guardian
    spec:
      # Permite monitorar também o nó control-plane (padrão para agentes de infra)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: guardian
          image: compute-node-guardian:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MAX_MEM_PERCENT
              value: "90.0"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
